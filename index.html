<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Russian Verbs Trainer</title>
  <link rel="stylesheet" href="style.css">

  <link rel="icon" href="favicon.ico">
</head>
<body>

<header>
  Russian Language Trainer 🇷🇺
</header>
  
  <!-- NAVBAR -->
  <nav>
    <a href="#home">Home</a>
    <a href="#trainer">Random Verb Trainer</a>
    <a href="#tableTrainer">Full Table Trainer</a>
  </nav>

  <!-- HOME SECTION -->
  <div id="home">
    <h1>Welcome 👋</h1>
    <p>This is your Russian verb training platform.</p>
  </div>

  <!-- TRAINER SECTION -->
  <div id="trainer" style="display:none;">
    
    <h1>Random Verb Trainer</h1>
  
    <div id="question"></div>
  
    <input type="text" id="answer" placeholder="Type your answer">
    <button onclick="checkAnswer()">Check</button>
  
    <p id="feedback"></p>

  </div>

  <!-- FULL TABLE SECTION -->
  <div id="tableTrainer" style="display:none;">
    <h1>Full Conjugation Trainer</h1>

    <!-- CATEGORY SELECTOR -->
    <div id="categoryView">
      <!-- <div id="categoryBar"></div> -->
      <div id="filters">
        <div id="categoryBar"></div>

        <select id="aspectFilter">
          <option value="any">Any aspect</option>
          <option value="imperfective">Imperfective</option>
          <option value="perfective">Perfective</option>
        </select>

        <select id="conjugationFilter">
          <option value="any">Any conjugation</option>
          <option value="1st_conj">1st conjugation</option>
          <option value="2nd_conj">2nd conjugation</option>
          <option value="mixed">Mixed</option>
        </select>

        <select id="stemFilter">
          <option value="any">Any stem change</option>
          <option value="regular">Regular</option>
          <option value="cons_change">Consonant change</option>
          <option value="stem_change">Stem change</option>
          <option value="suppletive">Suppletive</option>
          <option value="irregular">Irregular</option>
        </select>

        <select id="classFilter">
          <option value="any">Any class</option>
          <option value="I">Class I</option>
          <option value="II">Class II</option>
          <option value="III">Class III</option>
          <option value="IV">Class IV</option>
          <option value="V">Class V</option>
          <option value="VI">Class VI</option>
          <option value="VII">Class VII</option>
          <option value="VIII">Class VIII</option>
          <option value="IX">Class IX</option>
          <option value="X">Class X</option>
          <option value="XI">Class XI</option>
          <option value="XII">Class XII</option>
          <option value="XIII">Class XIII</option>
          <option value="XIV">Class XIV</option>
          <option value="XV">Class XV</option>
          <option value="XVI">Class XVI</option>
          <option value="irregular">Irregular</option>
        </select>

        <input 
          type="text"
          id="searchFilter"
          placeholder="Search"
        >
      </div>
    </div>

    <!-- VERB LIST -->
    <div id="verbListView" style="display:none;">
      <button onclick="goToCategories()">← Back</button>
      <div id="verbList"></div>
    </div>
    
    <!-- TABLE VIEW -->
    <div id="tableView" style="display:none;">
      <button onclick="goToCategories()">← Back</button>
      <div id="tableContainer"></div>
      <button onclick="checkTable()">Check</button>
      <p id="tableResult"></p>
    </div>

  </div>

  <script src="state.js"></script>
  <script src="router.js"></script>
  <script src="filters.js"></script>
  <script src="render.js"></script>
  <script src="navigation.js"></script>
  <script src="random.js"></script>
  <script src="app.js"></script>
</body>
</html>
